# Standalone TTS stack: OpenAI gateway (mp3/opus/aac/flac/wav/pcm, streaming)
# in front of the audio.cpp server (:8083, ../audio-cpp-tts.sh — Qwen3-TTS
# 1.7B Base Q8, voice lucy). The gateway runs alone (entrypoint overridden to
# gateway.py) and streams the backend's pcm while it transcodes to the
# requested format. Details: README.md.
#
# The gufo serve tts backend (23.11.2026, :8082) and the former embedded
# variant (pockettts.cpp/Vulkan, removed 2026-11-23) are in this file's Git
# history.
name: tts-gateway

services:
  tts-gateway:
    # Gateway-only proxy in front of the audio.cpp server on the host (model
    # id qwen3-tts-12hz-1.7b-base unchanged). stream_format=audio makes
    # audio.cpp stream raw PCM; lucy resolves to the server-side voice preset.
    build: .
    image: local/tts-gateway:fab7972-onset1-opus1-acpp1
    container_name: tts-gateway
    restart: unless-stopped
    entrypoint: ["python3", "/opt/tts/gateway.py"]
    ports:
      - "8081:8080"               # all interfaces (like gufo): containers reach this via host.docker.internal;
                                  # 127.0.0.1-only would be invisible to them. See README "Networking upgrade".
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TTS_BACKEND: http://host.docker.internal:8083
      TTS_STREAM_FORMAT: audio    # audio.cpp streams PCM only with stream_format set
      TTS_DEFAULT_VOICE: lucy     # fills a missing/empty "voice" (server voice preset)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
