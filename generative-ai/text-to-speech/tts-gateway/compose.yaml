# Standalone TTS stack: OpenAI gateway (mp3/opus/aac/flac/wav/pcm, streaming)
# in front of gufo serve tts (:8082, ../gufo-tts.sh). The gateway runs alone
# (entrypoint overridden to gateway.py) and streams gufo's pcm while it
# transcodes to the requested format. Details: README.md.
#
# The former embedded-backend variant (pockettts.cpp/Vulkan, removed 2026-11-23)
# is kept in this file's Git history.
name: tts-gateway

services:
  tts-gateway:
    # Gateway-only proxy in front of gufo serve tts on the host (no reference
    # registration — lucy lives in gufo's serve flags). Clients address the
    # model id qwen3-tts-12hz-1.7b-base unchanged.
    image: local/tts-gateway:fab7972-onset1-opus1
    container_name: tts-gateway
    restart: unless-stopped
    entrypoint: ["python3", "/opt/tts/gateway.py"]
    ports:
      - "8081:8080"               # all interfaces (like gufo): containers reach this via host.docker.internal;
                                  # 127.0.0.1-only would be invisible to them. See README "Networking upgrade".
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TTS_BACKEND: http://host.docker.internal:8082
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
